[package]
name = "oar-registry"
version = "0.1.0"
description = "Open App Registry (OAR): onchain application identity for Solana"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/gwapupward-hub/oar"

[lib]
crate-type = ["cdylib", "lib"]
name = "oar_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.0"
solana-security-txt = "=1.1.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
