name: Release
# Manual and deliberate: Actions → Release → Run workflow (branch main), with the version from package.json.
# It runs the full CI gate (ci.yml) on that exact commit, then creates tag v<version> and a GitHub release with
# checksummed assets. A version with a suffix such as -rc.1 is published as a pre-release. No job here receives
# signer material, deploys, or publishes to npm.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v; must equal package.json (for example 0.1.1-rc.1)
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Releases are cut from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow on main, not ${GITHUB_REF}."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Version is consistent and the tag is new
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs check "$VERSION"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" --silent 2>/dev/null; then
            echo "Tag v${VERSION} already exists. Bump the version instead of moving a tag."
            exit 1
          fi
  checks:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the tag and the release; nothing else in this run can write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oar_registry-${{ github.sha }}
          path: ${{ runner.temp }}/oar-artifact
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-report-${{ github.sha }}
          path: ${{ runner.temp }}/deps
      - run: npm ci --ignore-scripts && npm run build
      - name: Assemble assets (the binary must reproduce the devnet deployment when the program is unchanged)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/release.mjs assemble "$VERSION" --artifact-dir "$RUNNER_TEMP/oar-artifact" \
            --dependency-report "$RUNNER_TEMP/deps" --out "$RUNNER_TEMP/release" --notes "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Create tag and release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          kind=--latest
          if [[ "$VERSION" == *-* ]]; then kind=--prerelease; fi
          gh release create "v${VERSION}" "$RUNNER_TEMP"/release/* --target "$GITHUB_SHA" \
            --title "OAR v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" "$kind"
