name: OAR checks
on:
  push:
  pull_request:
  workflow_dispatch:
  # release.yml runs this exact workflow as its gate.
  workflow_call:
# Third-party code runs only from actions pinned to full commit SHAs (tag in the comment; Dependabot keeps them current).
permissions:
  contents: read
# bash with -o pipefail, so a failing command piped into tee still fails its step.
defaults:
  run:
    shell: bash
jobs:
  # Builds the program from source inside the digest-pinned builder recorded in release/devnet.json.
  # The uploaded artifact (binary + build-metadata.json) is what scripts/devnet/deploy.mjs deploys.
  # No job here deploys or receives signer material.
  program:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Pinned builder
        id: builder
        run: |
          img="$(node -p "require('./release/devnet.json').builderImage")"
          [[ "$img" =~ ^quay.io/ottersec/anchor@sha256:[0-9a-f]{64}$ ]]
          echo "image=$img" >> "$GITHUB_OUTPUT"
          docker pull -q "$img"
          docker run --rm "$img" sh -c 'rustc --version; cargo --version; solana --version; anchor --version; cargo-build-sbf --version' | tee "$RUNNER_TEMP/tool-versions.txt"
      - name: Rust checks, sBPF build and IDL drift (inside builder)
        env:
          BUILDER_IMAGE: ${{ steps.builder.outputs.image }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$BUILDER_IMAGE" sh -eu -c '
            cargo fmt --all -- --check
            cargo clippy --locked -p oar-registry --all-targets -- -D warnings
            cargo test --locked -p oar-registry --lib
            cargo build-sbf --manifest-path programs/oar-registry/Cargo.toml -- --locked
            cargo run --locked --release --manifest-path tools/idlgen/Cargo.toml -- programs/oar-registry > /tmp/fresh-idl.json
            diff -u idl/oar_registry.json /tmp/fresh-idl.json'
      - name: Second clean build must be byte-identical
        env:
          BUILDER_IMAGE: ${{ steps.builder.outputs.image }}
        run: |
          cp target/deploy/oar_registry.so "$RUNNER_TEMP/first.so"
          sudo rm -rf target
          docker run --rm -v "$PWD:/work" -w /work "$BUILDER_IMAGE" sh -eu -c 'cargo build-sbf --manifest-path programs/oar-registry/Cargo.toml -- --locked'
          cmp "$RUNNER_TEMP/first.so" target/deploy/oar_registry.so
      - name: Artifact and metadata
        env:
          BUILDER_IMAGE: ${{ steps.builder.outputs.image }}
        run: |
          # Only the binary and metadata are published; cargo build-sbf's generated target/deploy/*-keypair.json never leaves the runner.
          mkdir -p "$RUNNER_TEMP/oar-artifact"
          cp target/deploy/oar_registry.so "$RUNNER_TEMP/oar-artifact/"
          node scripts/devnet/artifact-metadata.mjs --so target/deploy/oar_registry.so --builder "$BUILDER_IMAGE" \
            --versions "$RUNNER_TEMP/tool-versions.txt" --double-build-match true --out "$RUNNER_TEMP/oar-artifact/build-metadata.json"
          { echo '```json'; cat "$RUNNER_TEMP/oar-artifact/build-metadata.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oar_registry-${{ github.sha }}
          path: ${{ runner.temp }}/oar-artifact/
          if-no-files-found: error
          retention-days: 90
  client:
    needs: program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oar_registry-${{ github.sha }}
          path: ${{ runner.temp }}/oar-artifact
      - run: npm ci --ignore-scripts
      - run: npm run build && npm run typecheck && npm run test:cli && npm run test:devnet && npm run test:release && npm run check:source
      - run: npm run test:sdk
        env:
          OAR_PROGRAM_BINARY: ${{ runner.temp }}/oar-artifact/oar_registry.so
      - run: npm run generate && git diff --exit-code -- schema packages/sdk/src/generated packages/sdk/src/schemas.ts
      - run: python3 scripts/package-release.py /tmp/oar-candidate.zip
  # Rust advisories, licenses, bans and sources for both lockfiles; npm advisories and registry signatures.
  # New advisories fail this job on purpose. A reviewed exception goes in deny.toml with its reason.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install cargo-deny (pinned release, checksum verified)
        run: |
          f="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/$f.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$f.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/$f.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$f" >> "$GITHUB_PATH"
      - name: Rust dependencies (program and tools/idlgen)
        run: |
          mkdir -p "$RUNNER_TEMP/deps"
          cargo deny --locked check 2>&1 | tee "$RUNNER_TEMP/deps/cargo-deny-program.txt"
          cargo deny --locked --config deny.toml --manifest-path tools/idlgen/Cargo.toml check 2>&1 | tee "$RUNNER_TEMP/deps/cargo-deny-idlgen.txt"
      - run: npm ci --ignore-scripts
      - name: npm advisories and registry signatures
        run: |
          npm audit --audit-level=low 2>&1 | tee "$RUNNER_TEMP/deps/npm-audit.txt"
          npm audit signatures 2>&1 | tee "$RUNNER_TEMP/deps/npm-audit-signatures.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-report-${{ github.sha }}
          path: ${{ runner.temp }}/deps/
          if-no-files-found: error
          retention-days: 90
