name: Stage OAR SDK on npm

# Explicit, owner-triggered staging. Publishing still requires 2FA approval on npmjs.com.
# Configure npm Trusted Publishing for this exact workflow filename, stage-only.
# This workflow cannot publish an already released version or stage the CLI.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing GitHub release version, without v (e.g. 0.1.1-rc.4)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-sdk-stage
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm CLI with staged-publishing support
        run: npm install --global npm@11.15.0 --ignore-scripts --no-audit --no-fund

      - name: Verify version and immutable GitHub release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || { echo "Expected rc prerelease version"; exit 1; }
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./packages/sdk/package.json').version")" = "$VERSION"
          test "$(git rev-parse "v${VERSION}^{commit}")" = "$GITHUB_SHA"
          gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName | grep -Fx "v${VERSION}"
          if npm view "@open-app-registry/sdk@${VERSION}" version >/dev/null 2>&1; then
            echo "This SDK version is already published. Never republish it."
            exit 1
          fi

      - name: Build and inspect SDK package
        run: |
          npm ci --ignore-scripts
          npm run build -w @open-app-registry/sdk
          npm run typecheck -w @open-app-registry/sdk
          npm pack --dry-run -w @open-app-registry/sdk

      - name: Stage SDK (npm approval remains required)
        run: npm stage publish -w @open-app-registry/sdk --access public --tag next
